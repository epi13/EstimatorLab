<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/base/index.css">
  <style>
    /* search/fuzzy_search.html */
    body[data-page="search-fuzzy-search"] { --pad: 10px; --gap: 8px; }
    body[data-page="search-fuzzy-search"] { font-family: system-ui, sans-serif; margin: 1.25rem; }
    body[data-page="search-fuzzy-search"] h1 { margin-bottom: .5rem; }
    body[data-page="search-fuzzy-search"] .row { display: grid; grid-template-columns: 1fr; gap: var(--gap); margin-bottom: var(--pad); }
    body[data-page="search-fuzzy-search"] .controls { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
    @media (min-width: 900px) {
    body[data-page="search-fuzzy-search"] .controls { grid-template-columns: 2fr 1fr 1fr 1fr; }
    }
    body[data-page="search-fuzzy-search"] input[type="text"], body[data-page="search-fuzzy-search"] input[type="file"], body[data-page="search-fuzzy-search"] select, body[data-page="search-fuzzy-search"] button {
        padding: .6rem; font-size: 1rem;
      }
    body[data-page="search-fuzzy-search"] fieldset { border: 1px solid var(--border); padding: var(--pad); }
    body[data-page="search-fuzzy-search"] legend { padding: 0 .4rem; }
    body[data-page="search-fuzzy-search"] #columnsWrap, body[data-page="search-fuzzy-search"] #searchKeysWrap { max-height: 160px; overflow: auto; display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    body[data-page="search-fuzzy-search"] table { width: 100%; border-collapse: collapse; margin-top: .6rem; }
    body[data-page="search-fuzzy-search"] th, body[data-page="search-fuzzy-search"] td { border: 1px solid #ddd; padding: .45rem; vertical-align: top; }
    body[data-page="search-fuzzy-search"] th { background: var(--surface-muted); position: sticky; top: 0; }
    body[data-page="search-fuzzy-search"] #status { font-size: .9rem; color: var(--text-muted); }
  </style>
  <title>Fuzzy JSONL Search</title>
</head>
<body data-page="search-fuzzy-search">

<h1>🔍 Fuzzy Search (JSONL)</h1>
<div class="row">
  <div class="controls">
    <input type="file" id="fileInput" accept=".jsonl,.json" />
    <input type="text" id="searchInput" placeholder="Type to search…" disabled />
    <input type="number" id="limitInput" min="1" value="200" title="Max results" />
    <select id="thresholdInput" title="Fuzziness threshold">
      <option value="0.3" selected>Threshold: 0.3 (default)</option>
      <option value="0.2">Threshold: 0.2 (stricter)</option>
      <option value="0.4">Threshold: 0.4</option>
      <option value="0.6">Threshold: 0.6 (fuzzier)</option>
    </select>
  </div>

  <div class="controls">
    <fieldset>
      <legend>Search these fields</legend>
      <div id="searchKeysWrap"><em>Load a file to see fields…</em></div>
    </fieldset>
    <fieldset>
      <legend>Show these columns</legend>
      <div id="columnsWrap"><em>Load a file to see fields…</em></div>
    </fieldset>
    <div>
      <button id="reindexBtn" disabled>Rebuild Index</button>
      <div id="status">No file loaded.</div>
    </div>
  </div>
</div>

<table id="resultsTable">
  <thead><tr id="theadRow"></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script type="module" src="fuzzy_search.js"></script>
</body>
</html>
