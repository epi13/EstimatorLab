<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    /* area/triangle_area.html */
    body[data-page="area-triangle-area"] { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    body[data-page="area-triangle-area"] label { display: block; margin-top: 10px; }
    body[data-page="area-triangle-area"] input, body[data-page="area-triangle-area"] select { width: 100%; padding: 5px; margin-top: 5px; }
    body[data-page="area-triangle-area"] .section { display: none; margin-top: 20px; }
    body[data-page="area-triangle-area"] .visible { display: block; }
    body[data-page="area-triangle-area"] svg { margin-top: 10px; max-width: 100%; height: auto; }
    body[data-page="area-triangle-area"] .output { margin-top: 20px; font-size: 1.2em; }
    body[data-page="area-triangle-area"] .history { margin-top: 20px; font-size: 0.9em; background: var(--surface-muted); padding: 10px; border: 1px solid var(--border); }
  </style>
  <title>Triangle Area Calculator</title>
</head>
<body data-page="area-triangle-area">
  <h2>Triangle Area Calculator</h2>

  <label for="method">Choose method:</label>
  <select id="method">
    <option value="baseHeight">Base & Height</option>
    <option value="heron">Three Sides (Heron)</option>
    <option value="sas">Two Sides & Included Angle</option>
    <option value="coordinates">Coordinates</option>
  </select>

  <div>
    <label>Units:
      <select id="units">
        <option value="m²">m²</option>
        <option value="cm²">cm²</option>
        <option value="in²">in²</option>
        <option value="ft²">ft²</option>
      </select>
    </label>
  </div>

  <!-- Sections -->
  <div id="baseHeight" class="section visible">
    <label>Base: <input type="number" id="base" step="any"></label>
    <label>Height: <input type="number" id="height" step="any"></label>
    <svg><line x1="10" y1="80" x2="150" y2="80" stroke="black"/><line x1="10" y1="80" x2="10" y2="10" stroke="black"/></svg>
  </div>

  <div id="heron" class="section">
    <label>Side a: <input type="number" id="a" step="any"></label>
    <label>Side b: <input type="number" id="b" step="any"></label>
    <label>Side c: <input type="number" id="c" step="any"></label>
    <svg><polygon points="50,10 10,90 90,90" stroke="black" fill="none"/></svg>
  </div>

  <div id="sas" class="section">
    <label>Side 1: <input type="number" id="side1" step="any"></label>
    <label>Side 2: <input type="number" id="side2" step="any"></label>
    <label>Included angle: <input type="number" id="angle" step="any"></label>
    <label>Angle Unit:
      <select id="angleUnit">
        <option value="deg">Degrees</option>
        <option value="rad">Radians</option>
      </select>
    </label>
    <svg><line x1="10" y1="90" x2="80" y2="10" stroke="black"/><line x1="10" y1="90" x2="150" y2="90" stroke="black"/></svg>
  </div>

  <div id="coordinates" class="section">
    <label>X1, Y1: <input type="number" id="x1" step="any"> <input type="number" id="y1" step="any"></label>
    <label>X2, Y2: <input type="number" id="x2" step="any"> <input type="number" id="y2" step="any"></label>
    <label>X3, Y3: <input type="number" id="x3" step="any"> <input type="number" id="y3" step="any"></label>
    <svg><polygon points="10,90 60,10 110,90" stroke="black" fill="none"/></svg>
  </div>

  <div class="output">
    <h3 id="result">Area: —</h3>
  </div>

  <div class="history" id="history">History:<br></div>

  <script type="module" src="triangle_area.js"></script>
</body>
</html>
