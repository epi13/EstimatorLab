<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../app.css">
  <style>
    /* Additional styles can be added here if needed */
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Redline Editor</title>
  <meta name="description" content="Browser-based PDF markup editor (HTML + TypeScript-style JS + PDF.js + SVG overlay). Single-file demo." />
  <!-- Minimal, modern, utility-ish CSS (no framework) -->
</head>
<body data-page="pdf-markup">
<div class="app" aria-label="PDF Redline Editor">
  <div class="wrap--compact">
    <section class="card" id="leftCol">
      <div class="stack" role="toolbar" aria-label="Main toolbar">
        <div class="stack" role="group" aria-label="File">
          <input aria-label="Open PDF" type="file" id="openPDF" accept="application/pdf" />
          <div class="row">
            <button id="saveJSON" class="btn-sm" title="Save Project (JSON)">Save</button>
            <button id="loadJSON" class="btn-sm" title="Load Project (JSON)">Load</button>
          </div>
          <div class="row">
            <button id="exportPNG" class="btn-sm" title="Export PNG/JPEG">Export PNG/JPEG</button>
            <button id="exportPDF" class="btn-sm" title="Export Flattened PDF">Export PDF</button>
            <button id="exportAnn" class="btn-sm" title="Export Annotation-only PDF">Export Ann.</button>
          </div>
        </div>
        <div class="row" role="group" aria-label="Navigation">
          <button id="prevPage" class="btn-sm" title="Previous Page (PgUp)">◀</button>
          <div id="pageInfo" aria-live="polite">– / –</div>
          <button id="nextPage" class="btn-sm" title="Next Page (PgDn)">▶</button>
          <span class="sep"></span>
          <button id="zoomOut" class="btn-sm" title="Zoom Out (Ctrl/Cmd -)">-</button>
          <span id="zoomPct" class="badge" aria-live="polite">100%</span>
          <button id="zoomIn" class="btn-sm" title="Zoom In (Ctrl/Cmd +)">+</button>
          <button id="fitW" class="btn-sm" title="Fit Width">Fit W</button>
          <button id="fitP" class="btn-sm" title="Fit Page">Fit P</button>
        </div>
        <details class="group">
          <summary>Tools</summary>
          <div class="row" role="group" aria-label="Tools">
            <button data-tool="select" class="btn-sm" title="V — Select">🖱️</button>
            <button data-tool="text" class="btn-sm" title="T — Text">T</button>
            <button data-tool="highlighter" class="btn-sm" title="H — Highlighter">🖍️</button>
            <button data-tool="pen" class="btn-sm" title="P — Pen">✒️</button>
            <button data-tool="line" class="btn-sm" title="L — Line">／</button>
            <button data-tool="arrow" class="btn-sm" title="A — Arrow">➤</button>
            <button data-tool="rect" class="btn-sm" title="R — Rectangle">▭</button>
            <button data-tool="ellipse" class="btn-sm" title="O — Ellipse">◯</button>
            <button data-tool="callout" class="btn-sm" title="C — Callout">💬</button>
            <button data-tool="image" class="btn-sm" title="G — Image">🖼️</button>
            <button data-tool="table" class="btn-sm" title="Table">#️⃣</button>
            <button data-tool="eraser" class="btn-sm" title="Eraser">🩹</button>
            <button data-tool="note" class="btn-sm" title="Sticky Note">🗒️</button>
            <button id="stampBtn" class="btn-sm" title="Stamps">Stamp</button>
          </div>
        </details>
        <details class="group">
          <summary>Text & Number</summary>
          <div class="stack" role="group" aria-label="Text & Number formatting">
            <label>Font
              <select id="fontFamily" aria-label="Font family">
                <option>Inter</option>
                <option>Arial</option>
                <option>Times New Roman</option>
                <option>Courier New</option>
              </select>
            </label>
            <div class="row">
              <label>Size <input id="fontSize" type="number" value="14" min="6" max="96" style="width:72px"/></label>
              <button id="bold" class="btn-sm" title="Ctrl/Cmd+B">B</button>
              <button id="italic" class="btn-sm" title="Ctrl/Cmd+I"><i>I</i></button>
              <button id="underline" class="btn-sm" title="Ctrl/Cmd+U"><u>U</u></button>
              <button id="strike" class="btn-sm" title="Strikethrough"><s>S</s></button>
            </div>
            <div class="row">
              <label>Color <input id="textColor" type="color" value="#e11d48"/></label>
              <label>Fill <input id="textBg" type="color" value="#000000"/></label>
              <button id="numPalette" class="btn-sm" title="Number redline palette">123⇄</button>
            </div>
          </div>
        </details>
        <details class="group">
          <summary>Edit</summary>
          <div class="row" role="group" aria-label="Edit">
            <button id="undo" class="btn-sm" title="Undo (Ctrl/Cmd+Z)">↶</button>
            <button id="redo" class="btn-sm" title="Redo (Ctrl/Cmd+Y)">↷</button>
            <button id="del" class="btn-sm" title="Delete (Del)">Del</button>
            <button id="dup" class="btn-sm" title="Alt-drag or Duplicate">⎘</button>
            <button id="group" class="btn-sm" title="Group">Group</button>
            <button id="ungroup" class="btn-sm" title="Ungroup">Ungroup</button>
          </div>
        </details>

        <div class="hr"></div>
        <!-- Pages sidebar collapsed -->
        <details class="group">
          <summary>Pages</summary>
          <aside class="side" aria-label="Sidebar">
            <div class="tabs" role="tablist">
              <div class="tab active" role="tab" aria-selected="true" data-tab="thumbs">Thumbnails</div>
              <div class="tab" role="tab" aria-selected="false" data-tab="layers">Layers</div>
              <div class="tab" role="tab" aria-selected="false" data-tab="comments">Comments</div>
            </div>
            <div class="thumbs" id="thumbs" role="tabpanel" aria-label="Page Thumbnails"></div>
            <div class="layers" id="layers" role="tabpanel" aria-label="Layers" hidden></div>
            <div class="comments" id="comments" role="tabpanel" aria-label="Comments" hidden></div>
          </aside>
        </details>

        <div class="hr"></div>
        <!-- Properties panel collapsed -->
        <details class="group">
          <summary>Properties</summary>
          <aside class="props" aria-label="Style & Properties Panel">
            <div class="section">
              <h3>Styles</h3>
              <div class="row">
                <label>Stroke <input id="strokeColor" type="color" value="#e11d48"/></label>
                <label>Fill <input id="fillColor" type="color" value="#000000"/></label>
              </div>
              <div class="row">
                <label>Width <input id="strokeWidth" type="number" min="0" value="2" style="width:80px"/></label>
                <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="1"/></label>
              </div>
              <div class="row">
                <label>Dash <select id="dash">
                  <option value="">Solid</option>
                  <option value="4,4">4-4</option>
                  <option value="8,4">8-4</option>
                  <option value="12,6">12-6</option>
                </select></label>
                <label>Arrow <select id="arrow">
                  <option value="none">None</option>
                  <option value="end">End ▶</option>
                  <option value="start">◀ Start</option>
                  <option value="both">◀▶ Both</option>
                </select></label>
                <label><input id="shadow" type="checkbox"/> Shadow</label>
              </div>
              <div class="row">
                <button id="addPreset">+ Preset</button>
                <select id="presets"><option>Preset styles…</option></select>
              </div>
            </div>
            <div class="section">
              <h3>Object</h3>
              <div class="row">
                <button id="lock">Lock</button>
                <button id="hide">Hide</button>
                <button id="bringFront">Front</button>
                <button id="sendBack">Back</button>
              </div>
              <div class="row">
                <label><input id="snapGrid" type="checkbox" checked /> Snap to grid/guides</label>
              </div>
            </div>
            <div class="section">
              <h3>Export</h3>
              <div class="row">
                <label>Range <input id="exportRange" value="1-1" style="width:100px"/></label>
                <select id="exportFmt">
                  <option value="png">PNG</option>
                  <option value="jpeg">JPEG</option>
                </select>
              </div>
            </div>
          </aside>
        </details>
      </div>
    </section>

    <section class="card" id="rightCol">
      <div class="main" role="main">
        <section class="viewport-wrap" aria-label="Document viewport">
          <div class="rulers" aria-hidden="true">
            <div class="ruler-h" id="rulerH"></div>
            <div class="ruler-v" id="rulerV"></div>
          </div>
          <div class="viewport" id="viewport" tabindex="0" aria-label="Pages container"></div>
        </section>
      </div>
    </section>
  </div>
</div>

<div id="context" class="context" role="menu" aria-label="Context menu"></div>
<div id="tooltip" class="tooltip" hidden></div>

<!-- PDF.js & pdf-lib via CDN (no UI frameworks) -->
<script src="https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.min.js"></script>
<script>
  // Point the worker to the same CDN version
  if (window['pdfjsLib']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.worker.min.js';
  }
</script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <script src="markUp.js" type="module"></script>
</body>
</html>
