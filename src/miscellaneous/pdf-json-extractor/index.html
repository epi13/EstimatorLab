<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Structured JSON</title>
  <link rel="stylesheet" href="../../css/base/index.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="pdf-json-extractor">
  <main class="extractor-app">
    <header>
      <h1>PDF to Structured JSON</h1>
      <p>Extract text, OCR scanned pages, and infer simple tables directly in your browser.</p>
    </header>

    <section class="controls" aria-label="Extraction controls">
      <label class="file-picker">
        <span>Select PDF</span>
        <input id="pdfFile" type="file" accept="application/pdf">
      </label>
      <button id="extractBtn" type="button">Extract JSON</button>
      <button id="downloadBtn" type="button" disabled>Download JSON</button>
      <label>
        <span>Engine</span>
        <select id="engineMode">
          <option value="current" selected>Current (PDF.js)</option>
          <option value="mupdf">MuPDF WASM (adapter)</option>
          <option value="pdfium">PDFium WASM (adapter)</option>
        </select>
      </label>
      <label class="debug-toggle">
        <input id="bakeoffMode" type="checkbox">
        <span>Bakeoff scoring</span>
      </label>
      <label class="debug-toggle">
        <input id="debugMode" type="checkbox">
        <span>Debug overlay</span>
      </label>
    </section>

    <section class="status-panel" aria-live="polite">
      <p id="statusText">Choose a PDF to begin.</p>
      <progress id="statusProgress" max="100" value="0"></progress>
    </section>

    <section>
      <h2>Output</h2>
      <pre id="jsonOutput">{}</pre>
    </section>

    <section>
      <h2>Debug Overlays</h2>
      <div id="debugCanvases" class="debug-canvases"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
